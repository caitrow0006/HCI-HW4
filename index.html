<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>HCI Review Application</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1 id="page-title">HCI Review Application</h1>
        <div id="layout">
            <!-- Left-hand navbar: script.js adds one preview per question -->
            <nav id="sidebar">
                <h2>Questions</h2>
                <div id="preview-list"></div>
            </nav>

            <!-- Main area: script.js shows one card at a time in #card-area -->
            <main id="main">
                <!-- Used for error messages to the user, initially hidden -->
                <p id="error-message" class="hidden"></p>
                <div id="card-area">                    
                </div>

                <!-- TODO: add Previous and Next buttons (ids "prev-button", "next-button") and a counter element (id="counter") -->
                
                <nav id="prev-next">
                    <button id="prev-button">Previous</button>
                    <span id="counter"></span>
                    <button id="next-button">Next</button>
                </nav>

                <div id="add-form">
                    <h2>Add a question</h2>
                    <!-- TODO: add <label> elements for each input element.  -->
                    <label for="new-question">New Question:</label>
                    <input id="new-question" type="text" placeholder="New question">
                        
                    <label for="new-answer">New Answer:</label>
                    <input id="new-answer" type="text" placeholder="New answer">
                    <button id="add-button">Add question</button>
                </div>
                
                
            </main>
            
        </div>

        <dialog id="edit-dialog">
            <button id="close-dialog" class="close-btn" aria-label="Close dialog">&times;</button>
            <p>Question:</p>
            <textarea id="edit-question"></textarea>
            <p>Answer:</p>
            <textarea id="edit-answer"></textarea>
            <br>
            <button id="update-button">Update question</button>
        </dialog>

        <script src="script.js"></script>
    </body>
</html>
